org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
# V1.1.6: the checkout lives under a path with non-ASCII characters
# (D:\demo\01_项目代码\...). AGP 8.5.2 refuses that outright - "Your project
# path contains non-ASCII characters ... Please move the project" - even though
# nothing downstream actually breaks. This only relaxes that check; it does not
# touch encoding.
android.overridePathCheck=true
