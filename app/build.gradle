android {
    namespace = "com.lxmusic.android"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.lxmusic.android"
        minSdk = 24
        targetSdk = 34
        versionCode = project.ext.appVersionCode
        versionName = project.ext.appVersionName
        vectorDrawables { useSupportLibrary true }
    }

    signingConfigs {
        create("release") {
            // V1.1.1: one stable identity for every distributed APK.
            //
            // A debug-signed build changes certificate whenever the machine (or
            // the CI runner) that built it changes, and Android refuses to
            // update an installed app whose signature differs. CI provides the
            // real keystore through secrets; a local build without the env vars
            // falls back to the debug key so developers can still sideload.
            def ksPath = System.getenv("JIJIAN_KEYSTORE") ?: "signing/jijian.keystore"
            def ksFile = rootProject.file(ksPath)
            if (ksFile.exists()) {
                storeFile = ksFile
                storePassword = System.getenv("JIJIAN_KEYSTORE_PASSWORD") ?: "jijian2026"
                keyAlias = System.getenv("JIJIAN_KEY_ALIAS") ?: "jijian"
                keyPassword = System.getenv("JIJIAN_KEY_PASSWORD") ?: "jijian2026"
            } else {
                // No release keystore here: sign with the debug key so local
                // installs still work; CI always has the real one.
                storeFile = file(System.getenv("JIJIAN_DEBUG_KEYSTORE")
                    ?: "${System.getProperty("user.home")}/.android/debug.keystore")
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            }
        }
        // V1.1.6: pin the debug keystore explicitly when one is provided.
        //
        // Left to itself AGP uses `~/.android/debug.keystore` and creates a
        // `debug.keystore.lock` next to it; on a machine where that directory is
        // not writable by the build the whole debug variant dies in
        // `validateSigningDebug` with AccessDeniedException. Pointing the config
        // at a keystore we own keeps the local loop working without touching
        // the user profile. Unset -> AGP's own default, unchanged.
        def dbgPath = System.getenv("JIJIAN_DEBUG_KEYSTORE")
        if (dbgPath) {
            debug {
                storeFile = file(dbgPath)
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            signingConfig = signingConfigs.getByName("release")
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    packaging {
        resources { excludes.add("/META-INF/{AL2.0,LGPL2.1}") }
    }
}

/**
 * The distributable APK, uniquely named (QQ and most IM file transfers dedupe
 * by file name + size, so shipping every build as a plain app-debug.apk made
 * the new package look like a copy the chat already had).
 *
 * V1.1.1: renamed per build type - assembleRelease produces the real
 * `jijian-music-<v>-vc<c>.apk` (stable signing key), assembleDebug keeps the
 * `-debug` suffix. CI uploads the release one.
 */
tasks.register("versionedApk", Copy) {
    dependsOn("assembleRelease")
    from(layout.buildDirectory.file("outputs/apk/release/app-release.apk"))
    into(rootProject.layout.buildDirectory.dir("apk"))
    rename { "jijian-music-${project.ext.appVersionName}-vc${project.ext.appVersionCode}.apk" }
}

tasks.register("versionedDebugApk", Copy) {
    dependsOn("assembleDebug")
    from(layout.buildDirectory.file("outputs/apk/debug/app-debug.apk"))
    into(rootProject.layout.buildDirectory.dir("apk"))
    rename { "jijian-music-${project.ext.appVersionName}-vc${project.ext.appVersionCode}-debug.apk" }
}

