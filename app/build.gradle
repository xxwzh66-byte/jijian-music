// 删掉；设置页改为可折叠分组，新增「启动时自动检查更新」开关；删掉缺封面筛选与
// 播放统计里的「不重复曲目」。
//
// V1.1.0: 一次大版本整理——在线搜索栈（jsengine/source/WebView 引擎）整体移除，
// 主页改「正在听」优先、队列移除可撤销、缺封面筛、极光随封面主色、平板双栏；
// 工程面抽出 LyricController、设置写入收口为 update(transform)、看门狗阈值可配。
//
// V1.0.3: 启动静默检查更新（每 24h 一次，节流时间戳持久化），发现新版本在首页
// 标签栏上方挂公告条；同时清理死代码（allowShowUpdateAlert、过时设计文档归档），
// 并新增 GitHub Actions：push 自动跑测试、打 v* tag 自动构建并发 Release。
// V1.1.1: 签名统一。此前所有 APK 都用「构建机的 debug 证书」签名，本机与
// GitHub Actions 的证书不同，release 包无法覆盖升级本机安装（Android 报签名
// 冲突，只能先卸载）。现在 release 构建固定用 signing/jijian.keystore，CI 从
// secret 读同一份；本地无该文件时回落 debug 证书（仅供开发侧载）。
//
// 注意：升级到 1.1.1 需要先卸载旧版（证书变了，这是最后一次）。
// V1.1.2: 换启动图标——从「淡紫渐变底 + 深靛蓝八分音符」换成五根声波竖条
